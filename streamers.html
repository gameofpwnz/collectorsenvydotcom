<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ce-bg: #000000;
      --ce-card-bg: #0a0a0a;
      --ce-accent: #ffffff;
      --ce-green: #00ff88;
      --ce-text-main: #ffffff;
      --ce-text-dim: #a1a1a1;
      --ce-border: #222222;
      --ce-font: 'Inter', sans-serif;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--ce-font);
      background: transparent;
      color: var(--ce-text-main);
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }

    .streams-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-top: 20px;
    }

    .stream-card {
      background: var(--ce-card-bg);
      border: 1px solid var(--ce-border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .stream-card:hover { border-color: #444; }

    .stream-thumbnail {
      width: 100%;
      height: 169px;
      object-fit: cover;
      background: #111;
      display: block;
    }

    .stream-info { padding: 1.25rem; }

    .stream-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--ce-text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .stream-streamer {
      font-size: 0.85rem;
      color: var(--ce-text-main);
      margin-bottom: 4px;
    }

    .stream-game {
      font-size: 0.8rem;
      color: var(--ce-text-dim);
      margin-bottom: 12px;
    }

    .stream-viewers {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--ce-green);
      color: var(--ce-green);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--ce-green);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .no-streams, .loading {
      text-align: center;
      padding: 40px;
      color: var(--ce-text-dim);
      font-size: 0.9rem;
    }

    .error {
      background: var(--ce-card-bg);
      border: 1px solid #ff4444;
      color: #ff4444;
      padding: 15px;
      border-radius: 12px;
      margin: 20px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
<script src="/assets/nav.js?v=3"></script>
  <div id="streamsContainer"></div>

  <script>
    // ============================================
    // CONFIGURATION - EDIT THESE VALUES
    // ============================================
    
    // Your Cloudflare Worker URL (set this after deploying the backend)
    const BACKEND_URL = 'https://lively-glitter-e13f.ashton-98e.workers.dev';
    
    // List of Twitch streamers to track (comma-separated usernames)
    const STREAMERS = 'djraylovee, zavpaul, mohawk_marco, pwnzie_09, sch_zeus, ishreddii, avitusante, macsauceop';
    
    // ============================================
    // END CONFIGURATION
    // ============================================

    async function checkStreams() {
      const container = document.getElementById('streamsContainer');

      if (BACKEND_URL === 'YOUR_WORKER_URL_HERE') {
        container.innerHTML = '<div class="error">⚠️ Please configure your BACKEND_URL in the HTML file</div>';
        return;
      }

      container.innerHTML = '<div class="loading">🔄 Checking who\'s live...</div>';

      try {
        const response = await fetch(`${BACKEND_URL}?streamers=${encodeURIComponent(STREAMERS)}`);
        const data = await response.json();

        if (data.error) {
          container.innerHTML = `<div class="error">❌ Error: ${data.error}</div>`;
          return;
        }

        if (!data.data || data.data.length === 0) {
          container.innerHTML = '<div class="no-streams">😴 No one is streaming right now</div>';
          return;
        }

        // Display live streams
        const streamsHTML = data.data.map(stream => {
          const thumbnail = stream.thumbnail_url
            .replace('{width}', '440')
            .replace('{height}', '248');
          
          const viewers = stream.viewer_count.toLocaleString();

          return `
            <a href="https://twitch.tv/${stream.user_login}" target="_blank" class="stream-card">
              <img src="${thumbnail}" alt="${stream.title}" class="stream-thumbnail">
              <div class="stream-info">
                <div class="stream-title">${escapeHtml(stream.title)}</div>
                <div class="stream-streamer">${escapeHtml(stream.user_name)}</div>
                <div class="stream-game">${escapeHtml(stream.game_name)}</div>
                <div class="stream-viewers">
                  <span class="live-dot"></span>
                  ${viewers} viewers
                </div>
              </div>
            </a>
          `;
        }).join('');

        container.innerHTML = `<div class="streams-container">${streamsHTML}</div>`;

      } catch (error) {
        container.innerHTML = `<div class="error">❌ Failed to load streams: ${error.message}</div>`;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Auto-check on page load
    checkStreams();

    // Auto-refresh every 60 seconds
    setInterval(checkStreams, 60000);
  </script>
<script src="/assets/footer.js"></script>
</body>
</html>
