<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpTic Rings | Collectors Envy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/matchmaking/matchmaking.css">
</head>
<body data-mode="rings">
<script src="/assets/nav.js"></script>
    <div class="container">
        <div class="header">
            <h1>OpTic Rings</h1>
            <p>Browse who owns and wants OpTic Texas championship rings, spot trades, and find who has the number you're after. Add yourself in Discord with <code>!ringhave</code> and <code>!ringwant</code>.</p>
        </div>

        <div id="loading">LOADING...</div>

        <div id="app" hidden>
            <div class="toolbar">
                <div class="pill-group" id="period-pills" aria-label="Year"></div>
                <form class="lookup" id="lookup-form">
                    <input id="lookup-input" type="search" autocomplete="off" aria-label="Look up a number or member">
                    <button class="btn" type="submit">Look Up</button>
                </form>
            </div>

            <div class="stats" id="stats"></div>

            <div class="legend">
                <span><i class="swatch s-have"></i>Owned</span>
                <span><i class="swatch s-want"></i>Wanted</span>
                <span><i class="swatch s-match"></i>Trade match (owned + wanted)</span>
                <span><i class="swatch s-none"></i>Unclaimed</span>
            </div>

            <div class="pill-group" id="filter-pills" style="margin-bottom: 25px;"></div>

            <div id="matches"></div>
            <div id="grid-wrap"></div>
        </div>
    </div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title">
        <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">&times;</button>
        <div id="sheet-body"></div>
    </div>

    <script src="/matchmaking/matchmaking.js"></script>
<script src="/assets/footer.js"></script>
</body>
</html>
