<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay | Collectors Envy</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        /* Transparent so OBS shows the stream behind it. */
        html, body { background:transparent; overflow:hidden; font-family:'Inter',sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }
        .bar { position:fixed; left:2vw; bottom:3vh; display:flex; align-items:stretch; max-width:96vw; background:rgba(0,0,0,.82); border:1px solid #222; border-left:4px solid #00ff88; border-radius:14px; overflow:hidden; opacity:0; transform:translateY(12px); transition:opacity .5s, transform .5s; }
        .bar.on { opacity:1; transform:none; }
        .bar img { width:110px; height:110px; object-fit:cover; display:block; background:#111; }
        .bar img[hidden] { display:none; }
        .txt { padding:.8rem 1.2rem; display:grid; gap:.15rem; align-content:center; min-width:260px; max-width:640px; }
        .tag { color:#00ff88; font-size:.75rem; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; }
        .title { font-size:1.25rem; font-weight:700; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .sub { color:#a1a1a1; font-size:.9rem; }
        .price { color:#00ff88; font-weight:800; font-size:1.5rem; }
        .brand { position:fixed; right:2vw; bottom:3vh; font-weight:800; font-size:.8rem; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,.7); text-shadow:0 1px 4px #000; }
        .top .bar, .top .brand { bottom:auto; top:3vh; }
    </style>
</head>
<body>
<div class="bar" id="bar"><img id="pic" alt="" referrerpolicy="no-referrer" hidden><div class="txt"><div class="tag" id="tag"></div><div class="title" id="title"></div><div class="price" id="price"></div><div class="sub" id="sub"></div></div></div>
<div class="brand">collectorsenvy.com</div>
<script>
(function () {
    // Use as an OBS Browser Source. Options in the URL:
    //   ?show=auctions (default) or sold     what to show
    //   &seconds=7                           time per item
    //   &position=top                        move to the top of the screen
    var P = new URLSearchParams(location.search);
    var SHOW = P.get('show') === 'sold' ? 'sold' : 'auctions';
    var SECS = Math.max(3, Math.min(60, parseInt(P.get('seconds'), 10) || 7));
    if (P.get('position') === 'top') document.body.className = 'top';
    var AUC_SHEET = '1PX87RLCtOdYoHj_pyu-npCKglbLHrKKSkrLcMki7vo4';
    var SOLD = 'https://script.google.com/macros/s/AKfycby7nMG2FAkjJNOYesCA8_7erTRAEtUG4MEMSOe3com6IrvS7DN35Cp5AEPB7yTPApuh/exec?tab=sold';

    var bar = document.getElementById('bar'), pic = document.getElementById('pic');
    var tag = document.getElementById('tag'), title = document.getElementById('title'), price = document.getElementById('price'), sub = document.getElementById('sub');
    var items = [], n = 0, timer = null;

    function csv(text) {
        var rows = [], row = [], f = '', q = false;
        for (var k = 0; k < text.length; k++) {
            var c = text[k];
            if (q) { if (c === '"') { if (text[k + 1] === '"') { f += '"'; k++; } else q = false; } else f += c; }
            else if (c === '"') q = true;
            else if (c === ',') { row.push(f); f = ''; }
            else if (c === '\n' || c === '\r') { if (c === '\r' && text[k + 1] === '\n') k++; row.push(f); rows.push(row); row = []; f = ''; }
            else f += c;
        }
        if (f !== '' || row.length) { row.push(f); rows.push(row); }
        return rows;
    }
    function driveThumb(u) {
        var m = /^https:\/\/drive\.google\.com\/(?:uc\?(?:[^#]*&)?id=|file\/d\/|open\?id=)([\w-]+)/.exec(u || '');
        return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400' : u;
    }
    function load() {
        if (SHOW === 'sold') {
            return fetch(SOLD).then(function (r) { return r.json(); }).then(function (j) {
                return (j.items || []).slice(0, 5).map(function (i) {
                    return { tag: 'Just sold', title: i.description, price: i.price, sub: i.date, img: (i.images || [])[0] };
                });
            });
        }
        return fetch('https://docs.google.com/spreadsheets/d/' + AUC_SHEET + '/gviz/tq?tqx=out:csv&sheet=LiveAuctions')
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(csv).then(function (rows) {
                return rows.slice(1).filter(function (r) { return r[0] && r[0].trim(); }).map(function (r) {
                    return { tag: 'Live auction', title: r[0], price: r[1], sub: r[5] ? 'Ends ' + r[5] : '', img: r[2] };
                });
            });
    }
    function show() {
        if (!items.length) { bar.classList.remove('on'); return; }
        var it = items[n % items.length]; n++;
        bar.classList.remove('on');
        setTimeout(function () {
            tag.textContent = it.tag; title.textContent = it.title || ''; price.textContent = it.price || ''; sub.textContent = it.sub || '';
            var u = /^https:\/\//.test(it.img || '') ? driveThumb(it.img) : '';
            pic.onerror = function () { pic.hidden = true; };
            if (u) { pic.src = u; pic.hidden = false; } else pic.hidden = true;
            bar.classList.add('on');
        }, 500);
    }
    function refresh() {
        load().then(function (list) { items = list; if (n === 0) show(); }).catch(function () {});
    }
    refresh();
    setInterval(refresh, 120000);
    setInterval(show, SECS * 1000);
})();
</script>
</body>
</html>
