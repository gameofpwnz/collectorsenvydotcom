<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay | Collectors Envy</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        /* Transparent page; the card fills whatever size the OBS Browser Source is set to,
           so it works in any ratio (try 640x160 or 480x200). Text scales with the card height. */
        html, body { height:100%; background:transparent; overflow:hidden; font-family:'Inter',sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }
        .wrap { position:fixed; inset:0; container-type:size; }
        .bar { width:100%; height:100%; display:flex; align-items:stretch; background:rgba(0,0,0,.85); border:1px solid #222; border-left:4px solid #00ff88; border-radius:14px; overflow:hidden; opacity:0; transition:opacity .5s; }
        .bar.on { opacity:1; }
        .bar img.pic { height:100%; aspect-ratio:1; max-width:40%; object-fit:cover; display:block; background:#111; flex-shrink:0; }
        .bar img.pic[hidden] { display:none; }
        .txt { flex:1; min-width:0; padding:5cqh 6cqh; display:flex; flex-direction:column; justify-content:space-between; gap:2cqh; }
        .main { display:grid; gap:1.5cqh; align-content:start; min-height:0; }
        .tag { color:#00ff88; font-size:min(11cqh,4cqw); font-weight:800; text-transform:uppercase; letter-spacing:.12em; }
        .title { font-size:min(15cqh,5.5cqw); font-weight:700; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .price { color:#00ff88; font-weight:800; font-size:min(19cqh,7cqw); line-height:1.1; }
        .sub { color:#a1a1a1; font-size:min(10cqh,3.6cqw); }
        .foot { display:flex; align-items:center; gap:3cqh; border-top:1px solid #222; padding-top:2.5cqh; }
        .foot img { height:min(16cqh,6cqw); width:auto; display:block; }
        .foot span { color:#d4d4d4; font-weight:700; font-size:min(9cqh,3cqw); letter-spacing:.04em; white-space:nowrap; }
    </style>
</head>
<body>
<div class="wrap"><div class="bar" id="bar"><img class="pic" id="pic" alt="" referrerpolicy="no-referrer" hidden><div class="txt"><div class="main"><div class="tag" id="tag"></div><div class="title" id="title"></div><div class="price" id="price"></div><div class="sub" id="sub"></div></div><div class="foot"><img src="/assets/images/favicon-192.png" alt="Collectors Envy"><span>collectorsenvy.com</span></div></div></div></div>
<script>
(function () {
    // Use as an OBS Browser Source (set the source size to the card size you want). Options in the URL:
    //   ?show=auctions (default)             live auctions
    //        sold                            previously sold
    //        past                            past auction results
    //        all                             all three, mixed (or combine: show=auctions,sold)
    // Only rows marked Approved are shown once a sheet has an "Approved" column.
    //   &seconds=7                           time per item
    //   &images=off                          text only, no item photos
    var P = new URLSearchParams(location.search);
    var WANT = (P.get('show') || 'auctions').toLowerCase().split(',').map(function (x) { return x.trim(); });
    var SOURCES = ['auctions', 'past', 'sold'].filter(function (k) { return WANT.indexOf('all') > -1 || WANT.indexOf(k) > -1; });
    if (!SOURCES.length) SOURCES = ['auctions'];
    var NOIMG = P.get('images') === 'off';
    var SECS = Math.max(3, Math.min(60, parseInt(P.get('seconds'), 10) || 7));
    var AUC_SHEET = '1PX87RLCtOdYoHj_pyu-npCKglbLHrKKSkrLcMki7vo4';
    var SOLD = 'https://script.google.com/macros/s/AKfycby7nMG2FAkjJNOYesCA8_7erTRAEtUG4MEMSOe3com6IrvS7DN35Cp5AEPB7yTPApuh/exec?tab=sold';

    var bar = document.getElementById('bar'), pic = document.getElementById('pic');
    var tag = document.getElementById('tag'), title = document.getElementById('title'), price = document.getElementById('price'), sub = document.getElementById('sub');
    var items = [], n = 0, timer = null;

    function csv(text) {
        var rows = [], row = [], f = '', q = false;
        for (var k = 0; k < text.length; k++) {
            var c = text[k];
            if (q) { if (c === '"') { if (text[k + 1] === '"') { f += '"'; k++; } else q = false; } else f += c; }
            else if (c === '"') q = true;
            else if (c === ',') { row.push(f); f = ''; }
            else if (c === '\n' || c === '\r') { if (c === '\r' && text[k + 1] === '\n') k++; row.push(f); rows.push(row); row = []; f = ''; }
            else f += c;
        }
        if (f !== '' || row.length) { row.push(f); rows.push(row); }
        return rows;
    }
    function driveThumb(u) {
        var m = /^https:\/\/drive\.google\.com\/(?:uc\?(?:[^#]*&)?id=|file\/d\/|open\?id=)([\w-]+)/.exec(u || '');
        return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400' : u;
    }
    var YES = /^\s*(true|yes|y|x|1)\s*$/i, GATE = /^\s*(approved|show on stream|stream)\s*$/i;
    function sheetRows(tab) {
        return fetch('https://docs.google.com/spreadsheets/d/' + AUC_SHEET + '/gviz/tq?tqx=out:csv&sheet=' + tab)
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }).then(csv).then(function (rows) {
                // Approval gate: with a column headed "Approved" / "Show on stream" / "Stream", only rows ticked TRUE appear.
                // Without that column every row shows, as before.
                var gate = rows.length ? rows[0].findIndex(function (h) { return GATE.test(h); }) : -1;
                return rows.slice(1).filter(function (r) {
                    return r[0] && r[0].trim() && (gate < 0 || YES.test(r[gate] || ''));
                });
            });
    }
    var LOADERS = {
        auctions: function () {
            return sheetRows('LiveAuctions').then(function (rows) {
                return rows.map(function (r) { return { tag: 'Live auction', title: r[0], price: r[1], sub: r[5] ? 'Ends ' + r[5] : '', img: r[2] }; });
            });
        },
        past: function () {
            // Past tab is oldest-first; show newest first. Columns: title, 3 images, winner, bid, date, link. Did-not-sell rows are skipped.
            return sheetRows('Auctions').then(function (rows) {
                return rows.reverse().filter(function (r) { return !/^\s*dns\s*$/i.test(r[4] || ''); }).slice(0, 5).map(function (r) {
                    return { tag: 'Auction result', title: r[0], price: r[5], sub: r[6], img: r[1] };
                });
            });
        },
        sold: function () {
            return fetch(SOLD).then(function (r) { return r.json(); }).then(function (j) {
                // Approval gate: once the Previously-Sold tab has an "Approved" column (the Apps Script then sends
                // approved: true/false per item), only ticked items appear. Without it every item shows.
                var all = j.items || [];
                if (all.some(function (i) { return typeof i.approved === 'boolean'; })) all = all.filter(function (i) { return i.approved === true; });
                return all.slice(0, 5).map(function (i) {
                    return { tag: 'Just sold', title: i.description, price: i.price, sub: i.date, img: (i.images || [])[0] };
                });
            });
        }
    };
    // Loads every chosen source (one failing doesn't hide the others) and mixes them: one from each in turn.
    function load() {
        return Promise.all(SOURCES.map(function (k) { return LOADERS[k]().catch(function () { return []; }); })).then(function (lists) {
            var out = [];
            for (var i = 0; lists.some(function (l) { return i < l.length; }); i++) lists.forEach(function (l) { if (i < l.length) out.push(l[i]); });
            return out;
        });
    }
    function show() {
        if (!items.length) { bar.classList.remove('on'); return; }
        var it = items[n % items.length]; n++;
        bar.classList.remove('on');
        setTimeout(function () {
            tag.textContent = it.tag; title.textContent = it.title || ''; price.textContent = it.price || ''; sub.textContent = it.sub || '';
            var u = !NOIMG && /^https:\/\//.test(it.img || '') ? driveThumb(it.img) : '';
            pic.onerror = function () { pic.hidden = true; };
            if (u) { pic.src = u; pic.hidden = false; } else pic.hidden = true;
            bar.classList.add('on');
        }, 500);
    }
    function refresh() {
        load().then(function (list) { items = list; if (n === 0) show(); }).catch(function () {});
    }
    refresh();
    setInterval(refresh, 120000);
    setInterval(show, SECS * 1000);
})();
</script>
</body>
</html>
