        main { max-width:960px; margin:0 auto; padding:3rem 1.25rem 5rem; }

        .how { background:var(--ce-card-bg); border:1px solid var(--ce-border); border-radius:12px; padding:1.5rem; max-width:720px; }
        .how ul { list-style:none; display:grid; gap:.75rem; }
        .how li { display:flex; gap:.75rem; align-items:flex-start; font-weight:600; }
        .how li::before { content:''; flex:none; width:.6rem; height:.6rem; margin-top:.55rem; border-radius:50%; background:var(--ce-accent); }
        .how li span { display:block; font-weight:400; color:var(--ce-text-dim); font-size:.9rem; }
        .research { background:var(--ce-card-bg); border:1px solid var(--ce-border); border-radius:12px; padding:1.5rem; max-width:720px; }
        .row { display:flex; gap:.6rem; }
        .row input { flex:1; min-width:0; }
        .links { display:none; gap:.6rem; margin-top:1rem; flex-wrap:wrap; }
        .links a { background:#000; color:#fff; border:1px solid var(--ce-border); border-radius:8px; padding:.6rem .9rem; text-decoration:none; font-weight:600; font-size:.9rem; }
        .links a:hover { border-color:var(--ce-accent); color:var(--ce-accent); }

        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
        .card { background:var(--ce-card-bg); border:1px solid var(--ce-border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
        .card .ph { aspect-ratio:1/1; background:#111; display:flex; align-items:center; justify-content:center; color:var(--ce-text-dim); font-size:.8rem; }
        .card .ph img { width:100%; height:100%; object-fit:cover; display:block; }
        .card .body { padding:.9rem; display:grid; gap:.35rem; }
        .card .desc { font-size:.9rem; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
        .card .price { color:var(--ce-accent); font-weight:800; font-size:1.2rem; }
        .card .date { color:var(--ce-text-dim); font-size:.8rem; }
        h1 { font-size:2.5rem; font-weight:800; letter-spacing:-1px; text-transform:uppercase; }
        .sub { color:var(--ce-text-dim); margin:.5rem 0 2rem; }
        form { background:var(--ce-card-bg); border:1px solid var(--ce-border); border-radius:12px; padding:1.5rem; display:grid; gap:1.1rem; }

        input:focus, textarea:focus { outline:none; border-color:var(--ce-accent); }

        .thumbs img { width:80px; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--ce-border); }

<body>
<script src="/assets/nav.js?v=10"></script>
<main>
    <h1>OpTic Scuf Controllers</h1>
    <p class="sub">An archive of OpTic Scuf controllers: platforms, approximate years and notes. Research courtesy of twist_lj.</p>
    <input type="text" id="gq" class="search" placeholder="Search controllers" aria-label="Search controllers" style="background:#000;border:1px solid var(--ce-border);border-radius:8px;color:#fff;padding:.7rem .8rem;font:inherit">
    <div id="grid" class="grid"></div>
    <p id="gmsg" class="msg">Loading…</p>
    <pre id="dbg" class="msg" style="display:none;white-space:pre-wrap;word-break:break-all"></pre>
</main>
<div id="lb" class="lb" role="dialog" aria-label="Photo"><img id="lbimg" alt=""><div class="nav"><button id="lbclose" type="button">Close</button></div></div>
<script>
(function () {
    // Apps Script web app, OpTic-Scuf tab (?tab=optic). Add ?debug=1 to this page to see the raw feed.
    var FEED = 'https://script.google.com/macros/s/AKfycbyuNSk1kc9JjRuXD4fRtqbjKUsYNweD3yGf9AlPktlNmMtMXRDKRKiqTkrpY0KMYjA_2A/exec?tab=optic';
    var esc = function (t) { var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; };
    function driveThumb(u) {
        var m = /^https:\/\/drive\.google\.com\/(?:uc\?(?:[^#]*&)?id=|file\/d\/|open\?id=)([\w-]+)/.exec(u);
        return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000' : u;
    }
    var items = [], shown = [], grid = document.getElementById('grid'), gmsg = document.getElementById('gmsg');
    var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');

    if (/[?&]debug=1/.test(location.search)) {
        var dbg = document.getElementById('dbg');
        dbg.style.display = 'block';
        fetch(FEED + '&debug=1').then(function (r) { return r.text(); }).then(function (t) { dbg.textContent = t; })
            .catch(function (e) { dbg.textContent = 'Debug fetch failed: ' + e; });
    }

    function render() {
        var t = document.getElementById('gq').value.toLowerCase();
        shown = items.filter(function (i) { return !t || [i.name, i.platform, i.years, i.notes].join(' ').toLowerCase().indexOf(t) > -1; });
        grid.innerHTML = shown.map(function (i, n) {
            var ph = i.image ? '<img loading="lazy" referrerpolicy="no-referrer" alt="" src="' + esc(i.image) + '">' : 'No photo';
            var meta = [i.platform, i.years].filter(Boolean).join(' · ');
            return '<div class="card"><div class="ph" data-n="' + n + '">' + ph + '</div><div class="body"><div class="name">' + esc(i.name) + '</div>' +
                (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
                (i.notes ? '<div class="notes">' + esc(i.notes) + '</div>' : '') + '</div></div>';
        }).join('');
        Array.prototype.forEach.call(grid.querySelectorAll('.ph img'), function (img) {
            img.addEventListener('error', function () {
                var ph = img.parentNode;
                shown[+ph.getAttribute('data-n')].image = '';
                ph.textContent = 'No photo';
            });
        });
        gmsg.textContent = shown.length ? '' : (items.length ? 'No matches.' : 'Nothing here yet.');
    }
    grid.addEventListener('click', function (e) {
        var ph = e.target.closest ? e.target.closest('.ph') : null;
        if (!ph) return;
        var it = shown[+ph.getAttribute('data-n')];
        if (!it || !it.image) return;
        lbimg.referrerPolicy = 'no-referrer';
        lbimg.src = it.image;
        lb.classList.add('on');
    });
    document.getElementById('lbclose').onclick = function () { lb.classList.remove('on'); };
    lb.addEventListener('click', function (e) { if (e.target === lb) lb.classList.remove('on'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lb.classList.remove('on'); });
    document.getElementById('gq').addEventListener('input', render);
    fetch(FEED).then(function (r) { return r.json(); }).then(function (j) {
        items = (j.items || []).map(function (i) {
            i.image = /^https:\/\//.test(i.image || '') ? driveThumb(i.image) : '';
            return i;
        });
        render();
    }).catch(function () { gmsg.textContent = 'Could not load the archive right now.'; });
})();
</script>
</body>
